<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click Hearts</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Press Start 2P", cursive;
        overflow: hidden;
        transition: background 1s ease;
      }
      .heart {
        position: fixed;
        bottom: -50px;
        font-size: 2rem;
        animation: floatUp 4s linear forwards;
        pointer-events: none;
      }
      @keyframes floatUp {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(calc(-110 * min(var(--vh, 1vh), 1vh)))
            rotate(30deg);
          opacity: 0;
        }
      }
      #click-text {
        cursor: pointer;
        transition: opacity 0.5s;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }
      #click-text:hover {
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      }
    </style>
    <script
      src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"
      type="text/javascript"
    ></script>
    <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
    <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
    <script src="/_sdk/telemetry_sdk.js"></script>
  </head>
  <body
    data-template-id="__page-root"
    class="flex items-center justify-center"
    style="
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      background: rgb(0, 0, 0);
    "
  >
    <main>
      <p
        data-template-id="click-text"
        id="click-text"
        class="canva-text text-white text-2xl md:text-4xl"
        style="
          color: rgb(255, 255, 255);
          font-weight: 400;
          font-style: normal;
          font-size: 36px;
        "
      >
        CLICK
      </p>
    </main>
    <script src="/_sdk/editing_sdk.js"></script>
    <script>
      const body = document.body;
      const clickText = document.getElementById("click-text");
      let active = false;
      const colors = [
        "🖕",
        "nhớ trả tiền cho anh nheaaa iem",
        "🖕",
        "🖕",
        "🖕",
        "🖕",
        "🖕",
        "🖕",
        "🖕",
      ];

      clickText.addEventListener("click", () => {
        if (active) return;
        active = true;
        body.style.background = "linear-gradient(135deg, #f000, #f000)";
        clickText.style.opacity = "0";
        setTimeout(() => (clickText.style.display = "none"), 500);
        spawnHearts();
      });

      function spawnHearts() {
        createHeart();
        setInterval(createHeart, 300);
      }

      function createHeart() {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.textContent = colors[Math.floor(Math.random() * colors.length)];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = 1.5 + Math.random() * 2 + "rem";
        heart.style.animationDuration = 3 + Math.random() * 3 + "s";
        body.appendChild(heart);
        heart.addEventListener("animationend", () => heart.remove());
      }
    </script>

  </body>
</html>
